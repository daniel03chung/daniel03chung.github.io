<!DOCTYPE html>
<html lang="en">
<head>

  <title>Will You Be My Valentine?</title>
  <link rel="stylesheet" href="style.css" />
</head>

  <div class="card">
    <h1>Natalie, will you be my Valentine?</h1>

    <p id="response"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
